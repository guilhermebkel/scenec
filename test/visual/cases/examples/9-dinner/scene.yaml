    hair: short
    hair_color: brown
    skin: medium
    shirt: secondary
    beard: true
  mae:
    asset: person
    pose: sitting
    'on': c2
    facing: left
    hair: curly
    hair_color: black
    skin: dark
    outfit: dress
    shirt: primary
  filho:
    asset: person
    pose: celebrating
    behind: mesa
    offset: 0.2
    size: small
    hair: short
    hair_color: black
    skin: medium
    shirt: accent
    bottom: shorts
    depth: near
    layer: back
  pizza:
    asset: pizza
    'on': mesa
    align: center
  frutas:
    asset: fruit_bowl
    'on': mesa
    align: left
  burger:
    asset: burger
    'on': mesa
    align: far-left
  estante:
    asset: bookshelf
    at: far-right
