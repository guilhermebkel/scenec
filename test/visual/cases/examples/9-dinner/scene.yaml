    asset: window
    at: 0.2
  luz1:
    asset: pendant_lamp
    at: 0.33
    hang: 70
  luz2:
    asset: pendant_lamp
    at: 0.5
    hang: 70
  mesa:
    asset: table
    at: 0.47
